version: 1
id: hello-lottie-maker
profile: custom
canvas:
  width: 960
  height: 540
fps: 24
duration_seconds: 4
poster_frame: 84
loop: false
safe_area:
  top: 0.05
  right: 0.05
  bottom: 0.05
  left: 0.05
motion:
  intent: 用一個克制的四秒開場介紹 lottie-maker 的三步驟工作流
  personality: restrained
